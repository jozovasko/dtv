<!DOCTYPE html>
  

<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genza Produktu v20: Flow Motion</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #020205; font-family: 'Segoe UI', sans-serif; }
        
        #canvas-container { width: 100%; height: 100vh; display: block; cursor: default; }
        
        .overlay { position: absolute; top: 65px; left: 20px; pointer-events: none; z-index: 10; }
        h1 { color: #fff; font-size: 1.8rem; text-transform: uppercase; margin: 0; text-shadow: 0 0 15px #00ffcc; }
        p.subtitle { font-size: 1rem; color: #00ffcc; margin-top: 5px; font-weight: bold; }

        .controls { position: absolute; bottom: 30px; left: 30px; display: flex; gap: 10px; z-index: 20; flex-wrap: wrap; }
        .btn {
            background: rgba(0, 255, 204, 0.1); border: 1px solid #00ffcc; color: #00ffcc;
            padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;
            text-transform: uppercase; font-size: 0.75rem; transition: all 0.3s;
            backdrop-filter: blur(5px); pointer-events: auto; margin-bottom: 5px;
        }
        .btn:hover { background: #00ffcc; color: #000; box-shadow: 0 0 15px #00ffcc; }

        .legend {
            position: absolute; bottom: 30px; right: 30px;
            background: rgba(0, 0, 0, 0.8); border: 1px solid #444;
            padding: 15px; border-radius: 8px; color: #ccc;
            font-size: 0.85rem; pointer-events: none; z-index: 20;
            backdrop-filter: blur(5px); min-width: 150px;
        }
        .legend h4 { margin: 0 0 10px 0; color: #00ffcc; text-transform: uppercase; font-size: 0.7rem; border-bottom: 1px solid #555; padding-bottom: 5px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 8px; }
        .legend-icon { width: 25px; text-align: center; margin-right: 10px; font-size: 1.1rem; }
        .legend-key { color: #fff; font-weight: bold; margin-right: 5px; }

        .stage-card {
            position: absolute; right: 20px; top: 50%;
            transform: translateY(-50%) translateX(120%);
            width: 320px; background: rgba(10, 15, 30, 0.95);
            border-left: 4px solid #444; padding: 25px; color: #ddd;
            backdrop-filter: blur(10px); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: -10px 0 40px rgba(0,0,0,0.8); border-radius: 8px; z-index: 20;
        }
        .stage-card.active { transform: translateY(-50%) translateX(0); }
        .stage-card h3 { margin: 0 0 10px 0; color: #fff; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .tools-section { margin-top: 20px; padding-top: 15px; border-top: 1px dashed #555; font-size: 0.9rem; }
        .tools-label { color: #888; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 5px; display: block;}
        .tools-links a {
            color: #00ffcc; text-decoration: none; border-bottom: 1px dotted #555;
            margin-right: 10px; pointer-events: auto; font-weight: bold; transition: color 0.2s;
        }
        .tools-links a:hover { color: white; border-bottom: 1px solid white; text-shadow: 0 0 5px #00ffcc;}
        .cycle-steps { color: #fff; font-weight: bold; font-size: 1.1rem; margin-top: 15px; }
        .close-btn { position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 1.5rem; color: #888; }
        .close-btn:hover { color: white; }
    </style>

    <div class="overlay">
        <h1>Gen&eacute;za Produktu</h1>
        <p class="subtitle">v20.0: Flow Motion (Pohyb po &scaron;pir&aacute;le)</p>
    </div>

    <div class="controls">
        <button class="btn" onclick="moveCamera('top')">Poh&lcaron;ad Zhora</button>
        <button class="btn" onclick="moveCamera('side')">Poh&lcaron;ad Zboku</button>
        <button class="btn" onclick="moveCamera('bottom')">Poh&lcaron;ad Zdola</button>
        <button class="btn" onclick="moveCamera('reset')">Reset</button>
    </div>

    <div class="legend">
        <h4>Navig&aacute;cia</h4>
        <div class="legend-item"><span class="legend-icon">&#128433;&#65039;</span><span><span class="legend-key">&Lcaron;av&eacute;:</span> Posun</span></div>
        <div class="legend-item"><span class="legend-icon">&#128433;&#65039;</span><span><span class="legend-key">Prav&eacute;:</span> Rot&aacute;cia</span></div>
        <div class="legend-item"><span class="legend-icon">&#9898;</span><span><span class="legend-key">Koliesko:</span> Zoom</span></div>

    </div>

    <div id="info-panel" class="stage-card">
        <div class="close-btn" onclick="resetView()"></div>
        <h3 id="panel-title">Nzov</h3>
        <p id="panel-desc">Popis...</p>
        <div style="font-size:0.8rem; color:#888; margin-top:15px;">MIKRO-CYKLUS:</div>
        <div class="cycle-steps" id="panel-cycle">1 &rarr; 2 &rarr; 3</div>
        <div class="tools-section">
            <span class="tools-label" id="tools-label-text"></span>
            <div class="tools-links" id="panel-links"></div>
        </div>

    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls, raycaster, mouse;
        let animatedObjects = []; 
        let spiralDown, spiralUp; 
        let microCycles = [];
        let activeStageId = null;
        let hoveredGroup = null;
        
        let targetCamPos = new THREE.Vector3(0, 40, 70);
        let targetLookAt = new THREE.Vector3(0, 0, 0);
        let isCameraMoving = false;
        const clock = new THREE.Clock();

        // --- KONTANTY ---
        const SPIRAL_BOTTOM_Y = -10;
        const SPIRAL_TOP_Y = 40;
        const SPIRAL_MAX_RADIUS = 25;

        const stagesData = {
            'ether': {
                title: "1. \u00C9TER / MY\u0160LIENKA", 
                desc: "12 n\u00E1padov. F\u00E1za abstrakcie. AI generuje varianty.", 
                cycle: "Prompt \u2192 Vari\u00E1cia \u2192 V\u00FDber", 
                color: 0x00aaff,
                links: `<a href="https://chat.openai.com" target="_blank">ChatGPT</a> <a href="https://www.midjourney.com" target="_blank">Midjourney</a>`
            },
            'twin': {
                title: "2. VIRTU\u00C1LNE DVOJ\u010CA", 
                desc: "5 konceptov. Digit\u00E1lne testovanie a simul\u00E1cia.",
                cycle: "Model \u2192 Simul\u00E1cia \u2192 Valid\u00E1cia",
                color: 0x00ffcc,
                links: `<a href="https://www.blender.org" target="_blank">Blender</a> <a href="https://openscad.org" target="_blank">OpenSCAD</a>`
            },
            'gcode': {
                title: "3. PREKLADATE\u013D", 
                desc: "2 kandid\u00E1ti. Pr\u00EDprava vrstiev (Slicing).",
                cycle: "Slicing \u2192 Dr\u00E1hy \u2192 \u010Cas", 
                color: 0xffaa00,
                links: `<a href="https://www.prusa3d.com/prusaslicer/" target="_blank">PrusaSlicer</a>`
            },
            'matter': {
                title: "4. HMOTA / PRODUKT",
                desc: "1 V\u00DDISLEDOK. Fyzick\u00E1 v\u00FDroba a d\u00E1ta.", 
                cycle: "Tla\u010D \u2192 Meranie \u2192 IoT D\u00E1ta", 
                color: 0xff5500,
                links: `<a href="https://fablab.sk" target="_blank">3D Tla\u010D</a>`
            }
        };

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020205, 0.012);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(targetCamPos);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.maxDistance = 300;
            controls.mouseButtons = {
                LEFT: THREE.MOUSE.PAN,
                MIDDLE: THREE.MOUSE.ROTATE,
                RIGHT: THREE.MOUSE.ROTATE
            };

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            scene.add(new THREE.AmbientLight(0x404040, 3.0));
            const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
            dirLight.position.set(20, 50, 20);
            scene.add(dirLight);
            const centerLight = new THREE.PointLight(0xffaa00, 4, 60);
            scene.add(centerLight);

            // --- VYTVORENIE LEVELOV S POHYBOVMI ZNAMI ---
            // Definujeme rozsah 't' (0=dole, 1=hore), v ktorom sa objekty pohybuj
            
            // ter: t od 0.7 do 1.0
            createStage('ether', 40, 7, 0x00aaff, 'cloud', 0.7, 1.0);
            
            // Dvoj&#269;a: t od 0.4 do 0.7
            createStage('twin', 20, 5, 0x00ffcc, 'wireframe', 0.4, 0.7);
            
            // Gcode: t od 0.1 do 0.4
            createStage('gcode', 5, 2, 0xffaa00, 'slices', 0.1, 0.4);
            
            // Hmota: Statick dole (t=0)
            createStage('matter', SPIRAL_BOTTOM_Y, 1, 0xff5500, 'solid', 0, 0); 
            
            createSeparateSpirals();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onMouseClick);
            window.moveCamera = setCameraView;
            window.resetView = resetView;
        }

        function createStage(id, yCenter, count, color, type, tMin, tMax) {
            const group = new THREE.Group();
            group.position.y = 0; // Skupina je v nule, objekty sa hbu v nej
            group.userData = { id: id, isStage: true };

            // HITBOX - TORUS (Fixn na strednej pozcii levelu)
            // Umiestnime ho do stredu rozsahu
            const tMid = (tMin + tMax) / 2;
            const yMid = SPIRAL_BOTTOM_Y + tMid * (SPIRAL_TOP_Y - SPIRAL_BOTTOM_Y);
            const rMid = tMid * SPIRAL_MAX_RADIUS;

            let hitGeo, hitBox;
            const hitMat = new THREE.MeshBasicMaterial({ 
                visible: true, opacity: 0.0, transparent: true, depthWrite: false, side: THREE.DoubleSide
            });

            if (rMid > 2) {
                // Donut
                hitGeo = new THREE.TorusGeometry(rMid, 8, 16, 32); 
                hitBox = new THREE.Mesh(hitGeo, hitMat);
                hitBox.rotation.x = Math.PI / 2;
                hitBox.position.y = yMid;
            } else {
                // Hmota
                hitGeo = new THREE.SphereGeometry(9, 16, 16); 
                hitBox = new THREE.Mesh(hitGeo, hitMat);
                hitBox.position.y = SPIRAL_BOTTOM_Y - 2; 
            }
            hitBox.userData = { parentGroup: group, isHitbox: true };
            group.add(hitBox);

            // Vizuly
            let geometry;
            if(type === 'solid') geometry = new THREE.BoxGeometry(3.5, 3.5, 3.5);
            else if(type === 'slices') geometry = new THREE.CylinderGeometry(2.5, 2.5, 0.1, 32);
            else if(type === 'wireframe') geometry = new THREE.IcosahedronGeometry(2, 0);
            else geometry = new THREE.TorusKnotGeometry(1.2, 0.3, 64, 8);

            for(let i=0; i < count; i++) {
                const mat = new THREE.MeshStandardMaterial({ 
                    color: color, 
                    wireframe: type !== 'solid' && type !== 'slices',
                    transparent: true, opacity: 0.9,
                    emissive: color, emissiveIntensity: 0.4
                });
                const mesh = new THREE.Mesh(geometry, mat);

                // Nhodn po&#269;iato&#269;n pozcia v rmci rozsahu 't'
                const tStart = tMin + Math.random() * (tMax - tMin);
                const angleStart = Math.random() * Math.PI * 2;

                mesh.userData = { 
                    t: tStart,
                    tMin: tMin,
                    tMax: tMax,
                    offsetAngle: angleStart,
                    rotSpeed: (Math.random()-0.5)*0.05,
                    isStatic: (tMin === tMax) // Hmota sa nehbe
                };
                
                // Prv vpo&#269;et pozcie
                updateObjectPosition(mesh);

                group.add(mesh);
                animatedObjects.push({ mesh: mesh });
            }

            // Mikro-cyklus (Fixn na yMid)
            const cycleGroup = new THREE.Group();
            cycleGroup.visible = false;
            cycleGroup.position.y = (type==='solid') ? SPIRAL_BOTTOM_Y : yMid;
            
            const ringR = (type==='solid') ? 9 : rMid + 6;
            const ringMesh = new THREE.Mesh(
                new THREE.RingGeometry(ringR, ringR + 0.5, 64),
                new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide, transparent: true, opacity: 0.5 })
            );
            ringMesh.rotation.x = -Math.PI / 2;
            cycleGroup.add(ringMesh);

            const steps = stagesData[id].cycle.split(' \u2192 ');
            steps.forEach((step, i) => {
                const label = createTextSprite(step);
                const angle = (i / 3) * Math.PI * 2;
                label.position.set(Math.cos(angle) * ringR, 3, Math.sin(angle) * ringR);
                cycleGroup.add(label);
            });

            group.add(cycleGroup);
            microCycles.push({ id: id, group: cycleGroup });

            scene.add(group);
        }

        // Funkcia na vpo&#269;et pozcie objektu na zklade 't'
        function updateObjectPosition(mesh) {
            if (mesh.userData.isStatic) {
                mesh.position.set(0, SPIRAL_BOTTOM_Y, 0);
                return;
            }

            const t = mesh.userData.t;
            
            // Vpo&#269;et pozcie na pirle
            const y = SPIRAL_BOTTOM_Y + t * (SPIRAL_TOP_Y - SPIRAL_BOTTOM_Y);
            const radius = t * SPIRAL_MAX_RADIUS;
            
            // Uhol sa men s 't', aby to vyzeralo, e sa to&#269; pri klesan
            const angle = mesh.userData.offsetAngle + (t * 10); 

            mesh.position.x = Math.cos(angle) * radius;
            mesh.position.z = Math.sin(angle) * radius;
            mesh.position.y = y;
        }

        function createTextSprite(message) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512; canvas.height = 128;
            ctx.font = "Bold 50px Arial";
            ctx.fillStyle = "white";
            ctx.textAlign = "center";
            ctx.shadowColor = "black"; ctx.shadowBlur = 8;
            ctx.fillText(message, 256, 80);
            const texture = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
            sprite.scale.set(10, 2.5, 1);
            return sprite;
        }

        function createSeparateSpirals() {
            // Modr (Dole)
            const countDown = 3000; 
            const geoDown = new THREE.BufferGeometry();
            const posDown = []; const colDown = []; const tsDown = new Float32Array(countDown);
            const cBlue = new THREE.Color(0x00aaff);
            for(let i=0; i<countDown; i++) {
                posDown.push(0,0,0); colDown.push(cBlue.r, cBlue.g, cBlue.b); tsDown[i] = Math.random();
            }
            geoDown.setAttribute('position', new THREE.Float32BufferAttribute(posDown, 3));
            geoDown.setAttribute('color', new THREE.Float32BufferAttribute(colDown, 3));
            
            spiralDown = new THREE.Points(geoDown, new THREE.PointsMaterial({ size: 0.5, vertexColors: true, transparent: true, opacity: 0.7 }));
            spiralDown.userData = { ts: tsDown, dir: -1 }; 
            scene.add(spiralDown);

            // Zelen (Hore)
            const countUp = 3000;
            const geoUp = new THREE.BufferGeometry();
            const posUp = []; const colUp = []; const tsUp = new Float32Array(countUp);
            const cGreen = new THREE.Color(0x00ff00);
            for(let i=0; i<countUp; i++) {
                posUp.push(0,0,0); colUp.push(cGreen.r, cGreen.g, cGreen.b); tsUp[i] = Math.random();
            }
            geoUp.setAttribute('position', new THREE.Float32BufferAttribute(posUp, 3));
            geoUp.setAttribute('color', new THREE.Float32BufferAttribute(colUp, 3));
            
            spiralUp = new THREE.Points(geoUp, new THREE.PointsMaterial({ size: 0.5, vertexColors: true, transparent: true, opacity: 0.7 }));
            spiralUp.userData = { ts: tsUp, dir: 1 };
            scene.add(spiralUp);
        }

        function setCameraView(viewType) {
            isCameraMoving = true;
            if(viewType === 'top') {
                targetCamPos.set(0, 100, 0); targetLookAt.set(0, 0, 0);
            } else if (viewType === 'side') {
                targetCamPos.set(0, 20, 100); targetLookAt.set(0, 10, 0);
            } else if (viewType === 'bottom') {
                targetCamPos.set(0, -90, 0); targetLookAt.set(0, 0, 0);
            } else {
                targetCamPos.set(0, 40, 70); targetLookAt.set(0, 0, 0);
                resetView();
            }
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hitboxes = scene.children.filter(c => c.type === 'Group' && c.userData.isStage).map(g => g.children.find(child => child.userData.isHitbox));
            const intersects = raycaster.intersectObjects(hitboxes.filter(h => h));

            if (intersects.length > 0) {
                renderer.domElement.style.cursor = 'pointer';
                const parent = intersects[0].object.userData.parentGroup;
                if (hoveredGroup !== parent) {
                    if (hoveredGroup) hoveredGroup.scale.set(1, 1, 1);
                    hoveredGroup = parent;
                    parent.scale.set(1.1, 1.1, 1.1);
                }
            } else {
                renderer.domElement.style.cursor = 'default';
                if (hoveredGroup) {
                    hoveredGroup.scale.set(1, 1, 1);
                    hoveredGroup = null;
                }
            }
        }

        function onMouseClick() {
            if (hoveredGroup) activateStage(hoveredGroup.userData.id);
            else resetView();
        }

        function activateStage(id) {
            if (activeStageId === id) return;
            activeStageId = id;
            const data = stagesData[id];
            document.getElementById('panel-title').innerText = data.title;
            document.getElementById('panel-title').style.color = '#' + data.color.toString(16);
            document.getElementById('panel-desc').innerText = data.desc;
            document.getElementById('panel-cycle').innerText = data.cycle;
            document.getElementById('panel-links').innerHTML = data.links;
            document.getElementById('tools-label-text').innerText = "Pou\u017Eit\u00E9 n\u00E1stroje (Klikni):";
            document.getElementById('info-panel').classList.add('active');
            microCycles.forEach(mc => { mc.group.visible = (mc.id === id); });
        }

        function resetView() {
            activeStageId = null;
            document.getElementById('info-panel').classList.remove('active');
            microCycles.forEach(mc => mc.group.visible = false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updateSpiralMesh(mesh, time) {
            const pos = mesh.geometry.attributes.position.array;
            const ts = mesh.userData.ts;
            const dir = mesh.userData.dir;
            const count = ts.length;
            for(let i=0; i<count; i++) {
                if(dir === -1) ts[i] -= 0.001; else ts[i] += 0.0015;
                if(ts[i]<0) ts[i]=1; if(ts[i]>1) ts[i]=0;
                const y = SPIRAL_BOTTOM_Y + ts[i] * (SPIRAL_TOP_Y - SPIRAL_BOTTOM_Y);
                const rBase = ts[i] * SPIRAL_MAX_RADIUS;
                const rotDir = dir === 1 ? -1 : 1;
                const angle = ts[i]*(10*rotDir) + time * (i%2===0 ? 0.3 : -0.3)*rotDir;
                const r = rBase + Math.sin(time + ts[i]*10)*1.5;
                pos[i*3] = Math.cos(angle)*r;
                pos[i*3+1] = y;
                pos[i*3+2] = Math.sin(angle)*r;
            }
            mesh.geometry.attributes.position.needsUpdate = true;
        }

        function animate() {
/* DTV_PAUSE_HOOK_START */
    if (window.isSpiralPaused) {
      if (typeof controls !== 'undefined' && controls.update) controls.update();
      if (typeof renderer !== 'undefined' && typeof scene !== 'undefined' && typeof camera !== 'undefined') {
        renderer.render(scene, camera);
      }
      requestAnimationFrame(animate);
      return;
    }
    /* DTV_PAUSE_HOOK_END */
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            if (isCameraMoving) {
                camera.position.lerp(targetCamPos, 0.05);
                controls.target.lerp(targetLookAt, 0.05);
                if (camera.position.distanceTo(targetCamPos) < 0.5) isCameraMoving = false;
            }
            controls.update();
            
            // ANIMCIA OBJEKTOV (Pohyb po pirle)
            animatedObjects.forEach(obj => {
                if(obj.mesh) {
                    const m = obj.mesh;
                    
                    // Rotcia samotnho objektu
                    m.rotation.x += m.userData.rotSpeed;
                    m.rotation.y += m.userData.rotSpeed;

                    // Posun po drhe (ak nie je statick)
                    if (!m.userData.isStatic) {
                        m.userData.t -= 0.0005; // Rchlos&#357; toku dole
                        // Ak prejde pod minimum, vrti sa na maximum (slu&#269;ka)
                        if (m.userData.t < m.userData.tMin) {
                            m.userData.t = m.userData.tMax;
                        }
                        updateObjectPosition(m);
                    }
                }
            });

            updateSpiralMesh(spiralDown, time);
            updateSpiralMesh(spiralUp, time);

            const camY = camera.position.y;
            spiralDown.visible = camY > -5;
            spiralUp.visible = camY < 25;
            microCycles.forEach(mc => { if(mc.group.visible) mc.group.rotation.y = time * 0.2; });
            renderer.render(scene, camera);
        }
    </script>

<script id="dtv-theme-script">
  function setDtvTheme(isDark) {
    const btn = document.getElementById('themeToggleDtv');
    if (isDark) {
      document.body.classList.remove('theme-light');
      document.body.style.backgroundColor = '#000000';
      if (btn) btn.textContent = '🌙 Noc';
      applyThreeColor(0x000000);
    } else {
      document.body.classList.add('theme-light');
      document.body.style.backgroundColor = '#f8fafc';
      if (btn) btn.textContent = '☀️ Deň';
      applyThreeColor(0xf8fafc);
    }
  }

  function applyThreeColor(hexColor) {
    // Dynamické prispôsobenie WebGL kontextu, ak beží Three.js
    if (window.renderer && typeof window.renderer.setClearColor === 'function') {
      window.renderer.setClearColor(hexColor, 1);
    }
    if (window.scene && window.scene.background) {
      if (typeof THREE !== 'undefined') {
        window.scene.background = new THREE.Color(hexColor);
      }
    }
  }

  function toggleDtvTheme() {
    const isCurrentlyLight = document.body.classList.contains('theme-light');
    const targetDark = isCurrentlyLight; // ak je light, chceme dark
    localStorage.setItem('dtv_theme', targetDark ? 'dark' : 'light');
    setDtvTheme(targetDark);
  }

  function initDtvTheme() {
    const saved = localStorage.getItem('dtv_theme') || 'light';
    setDtvTheme(saved === 'dark');
  }

  // Spustenie pri načítaní a po inicializácii 3D scény
  window.addEventListener('DOMContentLoaded', initDtvTheme);
  window.addEventListener('load', () => {
    setTimeout(initDtvTheme, 300);
  });
</script>





<script id="dtv-motion-control">
  window.isSpiralPaused = false;

  function toggleSpiralMotion() {
    window.isSpiralPaused = !window.isSpiralPaused;
    const btn = document.getElementById('pauseToggleDtv');
    if (btn) {
      btn.textContent = window.isSpiralPaused ? '▶️ Spustiť špirálu' : '⏸️ Pozastaviť špirálu';
      btn.style.borderColor = window.isSpiralPaused ? '#eab308' : '#0284c7';
    }
  }
</script>
