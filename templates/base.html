<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} — DTV FabLab SK</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --badge-text: #0284c7;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07);
    }
    body.dark {
      --bg: #0b0f19;
      --card-bg: #161e2e;
      --border: #243247;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --badge-text: #38bdf8;
      --shadow: none;
    }
    body {
      margin: 0;
      padding: 1.5rem 1rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .container { max-width: 960px; margin: 0 auto; }
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .nav-brand {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .nav-brand:hover { color: var(--accent); }
    .nav-actions { display: flex; align-items: center; gap: 0.75rem; }
    .nav-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: all 0.2s ease;
    }
    .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
    header { padding-bottom: 1rem; margin-bottom: 1.5rem; }
    h1 { margin: 0.2rem 0 0.5rem 0; color: var(--text); font-size: 1.8rem; }
    p.lead { color: var(--accent); margin: 0; font-size: 1.1rem; }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      background: var(--badge-bg);
      color: var(--badge-text);
      border-radius: 4px;
      margin-bottom: 0.4rem;
    }
    footer {
      margin-top: 3.5rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
    }
  
    /* Vizuálne karty (Grid & Card Layout) */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
      margin-top: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .card h3 {
      margin: 0.2rem 0 0.5rem 0;
      font-size: 1.2rem;
      color: var(--text);
    }
    .card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.2rem;
      flex-grow: 1;
    }
    .btn {
      display: inline-block;
      text-align: center;
      background: var(--accent);
      color: #ffffff !important;
      font-weight: 600;
      text-decoration: none;
      padding: 0.65rem 1rem;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: var(--accent-hover);
    }

  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="container">
    <nav class="top-nav">
      <a href="/" class="nav-brand">⚙️ DTV <span>FabLab SK</span></a>
      <div class="nav-actions">
        <a href="/" class="nav-btn">🏠 Hlavná stránka</a>
        <a href="/msba.html" class="nav-btn">🎓 MSBA Krúžok</a>
        <button id="themeToggle" class="nav-btn" onclick="toggleTheme()">🌙 Noc</button>
      </div>
    </nav>

    {% block content %}{% endblock %}

    <footer>
      <p>DTV FabLab SK &bull; Vzdelávací portál zhmotňovania nápadov &bull; SSOT kánon (:8084)</p>
    </footer>
  </div>

  <script>
    function applyTheme(isDark) {
      const btn = document.getElementById('themeToggle');
      if (isDark) {
        document.body.classList.add('dark');
        if (btn) btn.textContent = '☀️ Deň';
      } else {
        document.body.classList.remove('dark');
        if (btn) btn.textContent = '🌙 Noc';
      }
    }
    function initTheme() {
      const saved = localStorage.getItem('dtv_theme') || 'light';
      applyTheme(saved === 'dark');
    }
    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark');
      localStorage.setItem('dtv_theme', isDark ? 'dark' : 'light');
      applyTheme(isDark);
    }
    initTheme();
  </script>
</body>
</html>
